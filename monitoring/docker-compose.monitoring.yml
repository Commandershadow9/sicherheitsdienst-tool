version: '3.8'

services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sicherheitsdienst-alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    environment:
      ALERTMANAGER_SLACK_WEBHOOK: ${ALERTMANAGER_SLACK_WEBHOOK}
      ALERTMANAGER_SLACK_CHANNEL: ${ALERTMANAGER_SLACK_CHANNEL}
      ALERTMANAGER_SLACK_AUDIT_CHANNEL: ${ALERTMANAGER_SLACK_AUDIT_CHANNEL}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL}
      ALERTMANAGER_WEBHOOK_BEARER: ${ALERTMANAGER_WEBHOOK_BEARER}
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--web.listen-address=:9093'
    networks: [ 'obs' ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  prometheus:
    image: prom/prometheus:latest
    container_name: sicherheitsdienst-prometheus
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
      - blackbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ 'obs' ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:latest
    container_name: sicherheitsdienst-grafana
    ports:
      - '127.0.0.1:3300:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required in .env}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    networks: [ 'obs' ]
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: sicherheitsdienst-blackbox
    ports:
      - '127.0.0.1:9115:9115'
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ 'obs' ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

networks:
  obs:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
